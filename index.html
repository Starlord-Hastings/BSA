<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hall of Legends</title>
  <style>
    :root {
      --bg: #f0f0f0;
      --chrome: #e8e8e8;
      --chrome-border: #d7d7d7;
      --text: #111111;
      --muted: #1d1d1d;
      --panel: #f7f7f7;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .browser-bar {
      height: 46px;
      background: var(--chrome);
      border-bottom: 1px solid var(--chrome-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      gap: 12px;
    }

    .address-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .address-bar {
      width: min(820px, 100%);
      height: 30px;
      background: #f5f5f5;
      border: 1px solid #d0d0d0;
      border-radius: 18px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 14px;
      color: #2e2e2e;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .address-icon {
      width: 14px;
      height: 14px;
      border: 1.5px solid #6f6f6f;
      border-radius: 50%;
      position: relative;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .address-icon::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 1.5px;
      background: #6f6f6f;
      right: -4px;
      bottom: -2px;
      transform: rotate(45deg);
      border-radius: 1px;
    }

    .browser-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .circle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #d0d0d0;
      border: 1px solid #b8b8b8;
    }

    .chat-pill {
      border: 1px solid #d0d0d0;
      background: #f8f8f8;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 14px;
      color: #2c2c2c;
      margin-left: 8px;
    }

    .page {
      flex: 1;
      background: #f2f2f2;
      padding: 26px 0 0 0;
    }

    .content {
      width: min(1200px, calc(100% - 24px));
      margin: 0 auto;
      background: rgba(255,255,255,0.1);
      min-height: calc(100vh - 46px);
      padding-left: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 2vw, 35px);
      font-weight: 700;
      line-height: 1.2;
      color: #111;
    }

    .subhead {
      margin: 30px 0 18px;
      font-size: 18px;
      color: #222;
      font-weight: 500;
    }

    .legend-name {
      margin: 0 0 10px;
      font-size: clamp(20px, 1.5vw, 28px);
      font-weight: 700;
      color: #111;
    }

    .legend-note {
      margin: 0;
      font-size: 18px;
      color: #111;
      font-style: normal;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="browser-bar">
    <div class="browser-actions">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
    </div>

    <div class="address-wrap">
      <div class="address-bar"><span class="address-icon"></span>https://starlord-hastings.github.io/BSA/</div>
    </div>

    <div class="browser-actions">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="chat-pill">Chat</div>
    </div>
  </div>

  <main class="page">
    <div class="content">
      <h1>Hall of Legends</h1>

      <div class="subhead">Founding Legends</div>

      <div class="legend-name">Legend Slayer</div>
      <p class="legend-note">The best bedwars player and friend.</p>
    </div>
  </main>
</body>
</html>
