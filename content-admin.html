<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BSA admin tools for standings and news.">
  <meta name="theme-color" content="#0b1020">
  <title>BSA Content Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#121a2b;--line:#26344c;--text:#f4f7ff;--muted:#aab8cf;--gold:#f2c56b;--green:#7fe0b0;--red:#ff929e}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0,#1d3768 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{width:min(980px,calc(100% - 32px));margin:auto}.top{border-bottom:1px solid var(--line);padding:16px 0}.toprow,.row,.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900}.brand b{color:var(--gold);margin-right:8px}a{color:inherit;text-decoration:none}.muted{color:var(--muted)}main{padding:32px 0 64px}h1{font-size:clamp(2rem,5vw,3rem);margin:0 0 8px}h2{margin:0 0 12px}.card,.post{padding:20px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#121a2b,#18243a);margin:18px 0}.form{display:grid;gap:12px;max-width:560px}label{display:grid;gap:5px;color:var(--muted);font-size:.9rem;font-weight:700}input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#0b1220;color:var(--text);font:inherit}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:8px;padding:10px 14px;background:linear-gradient(135deg,#f3ce7b,#d8a745);color:#17120a;font-weight:850;cursor:pointer}button.secondary{color:var(--text);background:#ffffff12;border:1px solid var(--line)}button.danger{color:#fff;background:#9e3949}button:disabled{opacity:.6;cursor:wait}.message{min-height:24px;color:var(--muted)}.error{color:var(--red)}.success{color:var(--green)}#tools{display:none}.standings-list,.posts{display:grid;gap:12px}.standing-row{display:grid;grid-template-columns:minmax(150px,1fr) 100px 100px auto;align-items:end;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px}.standing-row label{min-width:0}.post h3{margin:0 0 8px;color:var(--gold)}.post-body{white-space:pre-wrap;overflow-wrap:anywhere}.post-meta{font-size:.85rem;color:var(--muted)}footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted)}@media(max-width:600px){.standing-row{grid-template-columns:1fr 1fr}.standing-row .team-label{grid-column:1/-1}.standing-row button{grid-column:1/-1}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap toprow"><a class="brand" href="index.html"><b>🏆</b>BSA / CONTENT ADMIN</a><a class="muted" href="admin.html">Registration inbox</a></div></header>
  <main class="wrap">
    <p class="muted">ADMIN ACCESS</p><h1>Standings &amp; News</h1><p class="muted">Manage BSA results and publish announcements. Changes save to Supabase.</p>
    <section class="card" id="loginPanel"><h2>Admin sign-in</h2><form class="form" id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="loginButton" type="submit">Sign in</button></form><p class="message" id="loginMessage" role="status" aria-live="polite"></p></section>
    <section id="tools">
      <div class="card"><div class="row"><div><h2>Standings editor</h2><p class="muted">Update wins and losses, then save each team.</p></div><button class="secondary" id="refreshStandings" type="button">Refresh</button></div><div class="message" id="standingsMessage" role="status" aria-live="polite"></div><div class="standings-list" id="standingsList"></div></div>
      <div class="card"><h2>Post news</h2><form class="form" id="newsForm"><label>Title<input id="newsTitle" maxlength="160" required></label><label>Content<textarea id="newsContent" maxlength="10000" required></textarea></label><button id="postButton" type="submit">Publish news</button></form><p class="message" id="newsMessage" role="status" aria-live="polite"></p></div>
      <div class="card"><div class="row"><h2>Published news</h2><button class="secondary" id="refreshNews" type="button">Refresh</button></div><div class="message" id="postsMessage" role="status" aria-live="polite"></div><div class="posts" id="posts"></div></div>
      <div class="actions"><span class="muted" id="signedInAs"></span><button class="secondary" id="signOutButton" type="button">Sign out</button></div>
    </section>
    <p class="message" id="accessMessage" role="status" aria-live="polite"></p>
  </main>
  <footer><div class="wrap">BSA · Bloxd Sporting Association</div></footer>
  <script>
    const SUPABASE_URL="https://hxyaixaarceykrqfford.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY="sb_publishable_dY1BtBdmncJbIRH2nwPMJQ_C6xlyuER";
    const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
    const $=id=>document.getElementById(id);
    function say(id,text,type=""){const node=$(id);node.textContent=text;node.className=`message ${type}`.trim();}
    async function loadStandings(){say("standingsMessage","Loading standings…");$("standingsList").replaceChildren();const {data,error}=await client.from("standings").select("id,team_name,wins,losses").order("team_name");if(error){console.error("Standings load error:",error);say("standingsMessage","Could not load standings. Run supabase-content-setup.sql and confirm your account is an admin.","error");return;}for(const team of data||[]){const row=document.createElement("form");row.className="standing-row";row.dataset.id=team.id;const name=document.createElement("strong");name.className="team-label";name.textContent=team.team_name;row.appendChild(name);for(const [key,label] of [["wins","Wins"],["losses","Losses"]]){const wrap=document.createElement("label");wrap.textContent=label;const input=document.createElement("input");input.type="number";input.name=key;input.min="0";input.step="1";input.required=true;input.value=team[key];wrap.appendChild(input);row.appendChild(wrap);}const button=document.createElement("button");button.type="submit";button.textContent="Save";row.appendChild(button);row.addEventListener("submit",saveStanding);$("standingsList").appendChild(row);}say("standingsMessage",`${(data||[]).length} team(s) loaded.`);}
    async function saveStanding(event){event.preventDefault();const row=event.currentTarget,button=row.querySelector("button");button.disabled=true;const payload={wins:Number(row.elements.wins.value),losses:Number(row.elements.losses.value),updated_at:new Date().toISOString()};const {error}=await client.from("standings").update(payload).eq("id",row.dataset.id);button.disabled=false;if(error){console.error("Standings save error:",error);say("standingsMessage","Could not save this team’s record. Check your admin access and try again.","error");return;}say("standingsMessage","Standings saved.","success");}
    async function loadNews(){say("postsMessage","Loading news…");$("posts").replaceChildren();const {data,error}=await client.from("news_posts").select("id,title,content,created_at").order("created_at",{ascending:false});if(error){console.error("News load error:",error);say("postsMessage","Could not load news. Run supabase-content-setup.sql and confirm your account is an admin.","error");return;}for(const post of data||[]){const article=document.createElement("article");article.className="post";const title=document.createElement("h3");title.textContent=post.title;const body=document.createElement("div");body.className="post-body";body.textContent=post.content;const meta=document.createElement("p");meta.className="post-meta";meta.textContent=post.created_at?new Date(post.created_at).toLocaleString():"";const remove=document.createElement("button");remove.type="button";remove.className="danger";remove.textContent="Delete";remove.addEventListener("click",()=>deletePost(post.id));article.append(title,body,meta,remove);$("posts").appendChild(article);}say("postsMessage",`${(data||[]).length} published post(s).`);}
    async function deletePost(id){if(!confirm("Delete this news post? This cannot be undone."))return;const {error}=await client.from("news_posts").delete().eq("id",id);if(error){console.error("News delete error:",error);say("postsMessage","Could not delete the post. Check your admin access.","error");return;}say("newsMessage","News post deleted.","success");await loadNews();}
    async function showSession(session){const signedIn=Boolean(session);$("loginPanel").style.display=signedIn?"none":"block";$("tools").style.display=signedIn?"block":"none";if(!signedIn){$("signedInAs").textContent="";return;}$("signedInAs").textContent=`Signed in as ${session.user.email||"account"}`;say("accessMessage","Loading content tools…");await Promise.all([loadStandings(),loadNews()]);say("accessMessage","");}
    $("loginForm").addEventListener("submit",async event=>{event.preventDefault();const button=$("loginButton");button.disabled=true;say("loginMessage","Signing in…");const {data,error}=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});button.disabled=false;if(error){console.error("Sign-in error:",error);say("loginMessage","Sign-in failed. Check your Supabase Auth email and password.","error");return;}$("password").value="";say("loginMessage","Signed in.","success");await showSession(data.session);});
    $("newsForm").addEventListener("submit",async event=>{event.preventDefault();const button=$("postButton");button.disabled=true;say("newsMessage","Publishing…");const {error}=await client.from("news_posts").insert({title:$("newsTitle").value.trim(),content:$("newsContent").value.trim()});button.disabled=false;if(error){console.error("News publish error:",error);say("newsMessage","Could not publish. Confirm the content setup SQL has been run and you are an admin.","error");return;}event.currentTarget.reset();say("newsMessage","News published.","success");await loadNews();});
    $("refreshStandings").addEventListener("click",loadStandings);$("refreshNews").addEventListener("click",loadNews);
    $("signOutButton").addEventListener("click",async()=>{await client.auth.signOut();$("loginForm").reset();await showSession(null);});
    client.auth.getSession().then(({data,error})=>{if(error)say("loginMessage","Could not check the saved session. Please sign in again.","error");showSession(data?.session||null);});
    client.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT")showSession(null);});
  </script>
</body>
</html>
